# 서버가 이미지를 직접 만들지 않고 받아 쓰게 하는 덧칠.
#
#   docker compose --env-file ./.env \
#     -f docker-compose.yml -f docker-compose.registry.yml --profile full up -d
#
# 왜 필요한가. 메모리가 작은 서버에서는 이미지를 만들 수 없다. BFF 는 빌드
# 도중에 의존성을 받아 컴파일하느라 1GB 를 넘게 쓰고, 카메라 이미지는 계산
# 라이브러리를 통째로 내려받는다. 1GB 짜리 서버에서 이 과정은 끝나지 않는다.
#
# 그래서 만드는 일은 넉넉한 곳에서 한 번 하고(scripts/images-push.sh),
# 서버는 받아서 띄우기만 한다.
#
# 만드는 자리를 지우는 이유는, 남겨 두면 이미지가 없을 때 compose 가 조용히
# 빌드로 넘어가기 때문이다. 작은 서버에서는 그 순간 서버가 멎는다. 여기서는
# 이미지가 없으면 받아오기에 실패하고 멈추는 편이 낫다.
#
# 판 이름에 기본값을 두지 않는 것도 같은 이유다. 기본값이 있으면 서버가
# 이름을 적지 않은 채로도 뜨는데, 그때 받아 오는 것은 예전에 아무렇게나
# 올려 둔 이미지다. 무엇이 도는지 어디에도 적히지 않은 채 돌게 된다.
#
# yolo 는 만들어 올리지 않는다. vision 갈래라 배포 구성에 들어가지 않기
# 때문이다. 그 갈래를 켜면 이 줄이 없는 이미지를 찾다가 멈춘다.

services:
  user:
    build: !reset null
    image: ${IMAGE_REGISTRY:?이미지를 받아올 곳을 정해야 한다}/map-service-user:${IMAGE_TAG:?어느 판을 받을지 정해야 한다}

  agent:
    build: !reset null
    image: ${IMAGE_REGISTRY}/map-service-agent:${IMAGE_TAG:?어느 판을 받을지 정해야 한다}

  hub:
    build: !reset null
    image: ${IMAGE_REGISTRY}/map-service-hub:${IMAGE_TAG:?어느 판을 받을지 정해야 한다}

  yolo:
    # 받아올 이름을 주지 않는다. 이 갈래는 만들어 올리는 목록에 없어서 받을
    # 것이 애초에 없다. 만드는 자리만 지워 두면 갈래를 켰을 때 만들 것도
    # 받을 것도 없다고 이름을 대며 멈춘다 — 만드는 자리를 남기면 작은 서버가
    # 조용히 빌드로 넘어가고, 받을 이름을 적으면 없는 것을 받으러 간다.
    build: !reset null
