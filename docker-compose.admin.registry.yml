# 관리자 스택이 이미지를 직접 만들지 않고 받아 쓰게 하는 덧칠.
#
#   docker compose --env-file ./.env \
#     -f docker-compose.admin.yml -f docker-compose.admin.registry.yml up -d
#
# 서비스 쪽 덧칠(docker-compose.registry.yml)과 같은 이유로 둔다. 서버에서는
# 이미지를 만들지 않는다 — 화면 쪽은 만들 때 꾸러미를 통째로 내려받아 묶는데,
# 그 일이 서비스가 도는 기계에서 벌어지면 그동안 다른 것들이 밀린다.
#
# 만드는 자리를 지우는 이유도 같다. 남겨 두면 이미지가 없을 때 compose 가
# 조용히 만들기로 넘어간다. 받아오기에 실패하고 멈추는 편이 낫다.
#
# 판 이름은 서비스 쪽과 같은 값 하나를 쓴다. 콘솔만 다른 판으로 도는 상태를
# 만들지 않기 위해서다 — 콘솔은 서비스의 저장소를 직접 들여다보므로, 표가
# 바뀐 판과 어긋나면 화면이 빈 채로 뜬다.

services:
  admin:
    build: !reset null
    image: ${IMAGE_REGISTRY:?이미지를 받아올 곳을 정해야 한다}/map-service-admin:${IMAGE_TAG:?어느 판을 받을지 정해야 한다}

  admin-web:
    build: !reset null
    image: ${IMAGE_REGISTRY}/map-service-admin-web:${IMAGE_TAG:?어느 판을 받을지 정해야 한다}
