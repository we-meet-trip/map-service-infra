# map 서비스 스택 컨테이너 오케스트레이션 정의 파일.
#
# project name: map-service (컨테이너·네트워크·볼륨 prefix 로 사용된다)
#
# 스택 분리:
#   서비스 스택(이 파일)  — 사용자 트래픽을 받는 서비스와 그 저장소.
#   관리자 스택(docker-compose.admin.yml) — 운영 콘솔과 모니터링.
#   두 스택은 map-net 네트워크를 공유한다. 이 파일이 네트워크의 소유자이므로
#   기동은 서비스 → 관리자, 종료는 관리자 → 서비스 순서로 한다.
#
# 프로파일 구성:
#   infra   — 인프라 컨테이너만 (postgres / redis)
#   backend — 애플리케이션 컨테이너 (user / agent / hub / proxy)
#   full    — 위 둘 전부 (infra + backend)
#   vision  — 카메라 인식 서비스 (yolo). full 에 포함되지 않는 별도 프로파일이다.
#             이미지에 torch 가 들어가 무겁고 카메라 기능을 쓸 때만 필요하다.
#   routing — 경로 라우팅 엔진 (osrm-foot / osrm-bicycle). full 에 포함되지 않는
#             별도 프로파일이다. OSRM 데이터(scripts/osrm-rebuild.sh)를 빌드한
#             뒤에만 기동한다. hub 는 이 서비스에 depends_on 을 걸지 않으며,
#             미기동/미설정 시 실제 경로를 만들 수 없다는 오류를 반환한다.
#   프로파일에 속하지 않는 서비스는 `docker compose up` 시 기동되지 않는다.
#
# 환경 변수:
#   --env-file로 선택한 파일에서 각 서비스의 명시된 허용 변수만 주입한다.
#   postgres 의 POSTGRES_* 변수는 동일한 .env 에서 치환된다.
#
# 컨테이너 이름은 map-service-<서비스명> 으로 고정한다. 자동 생성 이름
# (map-hub-1 처럼 프로젝트명과 일련번호가 붙는 형태)은 어느 스택 소속인지
# 한눈에 들어오지 않는다. 이름을 고정하면 --scale 을 쓸 수 없는데,
# 이 스택은 수평 확장을 하지 않으므로 문제가 되지 않는다.
#
# 네트워크: 모든 서비스는 map-net 단일 브리지 네트워크에 연결된다.
# 포트는 보안상 127.0.0.1 루프백에만 바인딩한다.

name: map-service

# 서비스별 environment 허용목록으로 비밀값 전달 범위를 제한한다.
# 값 없는 YAML 항목은 선택한 --env-file/실행 환경에 있을 때만 전달된다.
# 로그가 무한히 쌓이지 않게 한다.
#
# 기본값은 크기 제한이 없다. 상태 확인만으로도 서비스마다 하루 수만 줄이
# 쌓이는데, 그것이 디스크를 채우면 저장소가 먼저 죽는다. 그때 드러나는 모습은
# "갑자기 아무것도 안 된다" 이고, 원인이 로그라는 것은 한참 뒤에야 보인다.
#
# 세 벌까지 남긴다. 되짚기에는 충분하고 서비스마다 30MB 를 넘지 않는다.
x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # postgres — PostGIS 확장이 포함된 메인 RDB.
  # init 디렉터리(./db/init)의 SQL 을 최초 부팅 시 자동 실행하여
  # hub_data 등 스키마를 사전 생성한다.
  # ports: 호스트 5432 (루프백) → 컨테이너 5432
  postgres:
    <<: *default-logging
    image: postgis/postgis:17-3.5
    container_name: map-service-postgres
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1g
    restart: unless-stopped
    # 유휴 약 220MiB. 공유버퍼와 PostGIS 인덱스가 커질 여지를 두고 1g.
    # postgis/postgis 는 amd64 전용이다(arm64 매니페스트 없음 — 17-3.5 ·
    # 17-3.5-alpine 모두 동일, manifest 실측 2026-07-29). platform 을 명시하지
    # 않으면 arm64 호스트(Apple Silicon)의 이미지 캐시가 없는 새 환경에서
    # `no matching manifest for linux/arm64/v8` 로 pull 이 실패하고, postgres 에
    # depends_on 을 건 user/agent/hub 까지 전부 기동 불가가 된다.
    platform: linux/amd64
    profiles: ["infra", "full"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # db/init/10-admin.sh 가 map_admin 읽기전용 역할을 만들 때 사용.
      # 관리자 스택 admin 컨테이너의 ADMIN_DATABASE_URL 비밀번호와 반드시 일치.
      MAP_ADMIN_PASSWORD: ${MAP_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 를 준다. 빼면 초기화 중에 잠깐 뜨는 내부 서버에도 응답이 와서,
      # 아직 받을 수 없는 상태를 준비됐다고 읽는다. 빈 볼륨 첫 부팅에서만
      # 열리는 창이라 평소에는 드러나지 않는다.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6

  # redis — L1 캐시 / 단기 키-값 저장소.
  # appendonly 모드로 지속화하여 재기동 시 데이터를 유지한다.
  # ports: 호스트 16379 → 컨테이너 6379 (호스트 측 충돌 회피용 매핑)
  redis:
    <<: *default-logging
    image: redis:7-alpine
    container_name: map-service-redis
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    restart: unless-stopped
    # 캐시·카운터·스트림만 담고 데이터셋을 담지 않아 유휴 약 10MiB.
    profiles: ["infra", "full"]
    # REDIS_PASSWORD 가 비어 있으면(현행) 무인증으로 기동한다.
    # 값이 설정되면 --requirepass 로 인증을 켜고 healthcheck 도 -a 로 인증한다.
    # $$ 는 compose 치환이 아니라 컨테이너 shell 확장(런타임)을 의미한다.
    command: ["sh", "-c", "redis-server --appendonly yes $${REDIS_PASSWORD:+--requirepass $$REDIS_PASSWORD}"]
    # redis 는 x-app-env 앵커를 쓰지 않으므로 REDIS_PASSWORD 를 .env 에서 명시 주입.
    environment:
      - REDIS_PASSWORD
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a $$REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  # osrm-foot — 도보 라우팅 엔진.
  # --mmap 1: 그래프를 통째로 읽어 올리지 않고 파일을 그대로 들여다본다.
  # 안 그러면 3.1G 짜리 그래프를 메모리에 펼치느라 아래 상한에 걸려 죽는다
  # (실측: 없이 = 1GiB 를 꽉 채우고 OOM, 붙이면 = 시작 70MiB, 30회 조회 후
  # 380MiB). 남는 부분은 커널이 알아서 버리므로 상한이 죽이는 선이 아니라
  # 눌러 두는 선으로 바뀐다. 경로 품질은 같다 — 같은 그래프를 읽는다.
  # scripts/osrm-rebuild.sh 가 named volume osrm-data 의 /foot/korea.osrm 로
  # 사전 빌드한 그래프를 read-only 로 마운트해 osrm-routed(MLD)로 서빙한다.
  # profiles: ["routing"] — full 에 포함되지 않는다. 데이터 빌드 후에만 기동.
  # ports: 호스트 5000 → 컨테이너 5000 (osrm-routed 기본 포트, 루프백 바인딩)
  osrm-foot:
    <<: *default-logging
    image: ghcr.io/project-osrm/osrm-backend:v26.5.0-amd64-alpine
    container_name: map-service-osrm-foot
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    restart: unless-stopped
    # --mmap 로 그래프를 파일 매핑해 읽으므로 상주 메모리가 상한보다 훨씬 작다.
    # osrm-backend 는 amd64 전용(arm64 미제공). arm64 호스트(Apple Silicon)는
    # 아래 platform 으로 amd64 에뮬레이션 실행된다. 프로덕션 amd64 서버는 네이티브.
    platform: linux/amd64
    profiles: ["routing"]
    command: ["osrm-routed", "--algorithm", "mld", "--mmap", "1", "/data/foot/korea.osrm"]
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      # 뿌리 주소는 그래프를 읽지 않고도 답한다. 좌표를 도로에 붙여 보는 조회로
      # 물어야 포트만 열린 상태와 길을 낼 수 있는 상태가 갈린다.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/nearest/v1/foot/126.9780,37.5665 | grep -q '\"code\":\"Ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      # 그래프를 여는 동안의 실패는 세지 않는다.
      start_period: 30s
    volumes:
      - osrm-data:/data:ro

  # osrm-bicycle — 자전거 라우팅 엔진.
  # foot 과 동일 빌드 절차의 /bicycle/korea.osrm 을 읽는다(같은 named volume 공유).
  # ports: 호스트 5001 → 컨테이너 5000 (foot 과 호스트 포트만 다르다)
  osrm-bicycle:
    <<: *default-logging
    image: ghcr.io/project-osrm/osrm-backend:v26.5.0-amd64-alpine
    container_name: map-service-osrm-bicycle
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    restart: unless-stopped
    # foot 과 같은 방식으로 읽는다.
    platform: linux/amd64
    profiles: ["routing"]
    command: ["osrm-routed", "--algorithm", "mld", "--mmap", "1", "/data/bicycle/korea.osrm"]
    ports:
      - "127.0.0.1:5001:5000"
    healthcheck:
      # 뿌리 주소는 그래프를 읽지 않고도 답한다. 좌표를 도로에 붙여 보는 조회로
      # 물어야 포트만 열린 상태와 길을 낼 수 있는 상태가 갈린다.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/nearest/v1/bicycle/126.9780,37.5665 | grep -q '\"code\":\"Ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      # 그래프를 여는 동안의 실패는 세지 않는다.
      start_period: 30s
    volumes:
      - osrm-data:/data:ro

  # user — BFF(Backend For Frontend) 애플리케이션.
  # 인접 디렉터리(../map-service-user)의 Dockerfile 로 빌드된다.
  # postgres / redis 의 healthcheck 통과를 기다린 후 기동된다.
  # ports: 호스트 8080 → 컨테이너 8080 (actuator/health 헬스체크)
  user:
    build:
      context: ../map-service-user
    container_name: map-service-user
    <<: *default-logging
    restart: unless-stopped
    # 유휴 약 670MiB. 상한을 걸면 JVM 이 힙을 상한 기준으로 다시 잡으므로
    # 아래 JAVA_TOOL_OPTIONS 로 비율을 함께 올린다. 둘 중 하나만 넣으면
    # 기본 비율 25%가 적용돼 힙이 512m 로 줄고 상한 이전보다 나빠진다.
    deploy:
      resources:
        limits:
          cpus: "2.0"  # 코어 수를 넘는 상한은 2코어 서버에서 생성이 거절된다
          memory: 2g
    environment:
      AGENT_BASE_URL:
      AGENT_TIMEOUT_SECONDS:
      APPLE_CLIENT_ID:
      APPLE_ENABLED:
      APPLE_KEY_ID:
      APPLE_PRIVATE_KEY_B64:
      APPLE_TEAM_ID:
      APPLE_VALIDATION_DELAY_MS:
      AUTH_ENFORCED:
      CHAT_BROADCAST_CHANNEL:
      CHAT_EXPIRY_GRACE_DAYS:
      CHAT_EXPIRY_SWEEP_INTERVAL_MS:
      CHAT_HISTORY_PAGE_SIZE:
      CHAT_INVITE_BASE_URL:
      CHAT_INVITE_PREVIEW_RATE_LIMIT:
      CHAT_INVITE_PREVIEW_RATE_WINDOW_SECONDS:
      CHAT_INVITE_RATE_LIMIT:
      CHAT_INVITE_RATE_WINDOW_SECONDS:
      CHAT_INVITE_TTL_DAYS:
      CHAT_MAX_MESSAGE_LENGTH:
      CHAT_MAX_PARTICIPANTS:
      CHAT_SEND_RATE_LIMIT:
      CHAT_SEND_RATE_WINDOW_SECONDS:
      CHAT_WS_ENDPOINT:
      CORS_ALLOWED_ORIGINS:
      HUB_BASE_URL:
      HUB_TIMEOUT_SECONDS:
      INTERNAL_SERVICE_TOKEN:
      JWT_ACCESS_TTL:
      JWT_PRIVATE_KEY:
      JWT_PUBLIC_KEY:
      JWT_REFRESH_TTL:
      KAKAO_APP_CALLBACK_SCHEME:
      KAKAO_AUTHORIZE_URI:
      KAKAO_OAUTH_CLIENT_ID:
      KAKAO_OAUTH_CLIENT_SECRET:
      KAKAO_OAUTH_REDIRECT_URI:
      KAKAO_TOKEN_URI:
      KAKAO_USER_INFO_URI:
      LOCATION_ENC_ACTIVE_KID:
      LOCATION_ENC_ENABLED:
      LOCATION_ENC_KEYS:
      LOCATION_WIRE_ENABLED:
      LOCATION_WIRE_KEY:
      LOCATION_WIRE_MAX_AGE_SECONDS:
      NEARBY_RADIUS_METERS:
      NEARBY_SIZE:
      POSTGRES_DB:
      POSTGRES_HOST:
      POSTGRES_PASSWORD:
      POSTGRES_PORT:
      POSTGRES_USER:
      RECOMMEND_CACHE_BUDGET_ROUND_STEP:
      RECOMMEND_CACHE_REFRESH_EVERY_HITS:
      RECOMMEND_CACHE_REFRESH_QUEUE_CAPACITY:
      RECOMMEND_CACHE_TIME_ROUND_STEP_MINUTES:
      REDIS_CACHE_LINK_TTL_SECONDS:
      REDIS_CACHE_TTL_SECONDS:
      REDIS_DB_BLACKLIST:
      REDIS_DB_CACHE:
      REDIS_DB_CHAT:
      REDIS_DB_COUNTERS:
      REDIS_DB_DEFAULT:
      REDIS_DB_DRAFTS:
      REDIS_DB_RATELIMIT:
      REDIS_DB_STREAMS:
      REDIS_DRAFT_TTL_SECONDS:
      REDIS_HOST:
      REDIS_PASSWORD:
      REDIS_PORT:
      RESEARCH_DAILY_LIMIT:
      REVIEWS_PREWARM_BATCH_SIZE:
      REVIEWS_PREWARM_ENABLED:
      REVIEWS_PREWARM_MAX_PLACES:
      REVIEWS_PREWARM_POOL_SIZE:
      REVIEWS_PREWARM_QUEUE_CAPACITY:
      REVIEWS_SUMMARY_TTL_SECONDS:
      STREAMS_COMMAND_TIMEOUT_SEC:
      STREAMS_WATCHDOG_INTERVAL_MS:
      STREAM_CONSUMER:
      STREAM_DLQ:
      STREAM_GROUP:
      STREAM_MAXLEN:
      STREAM_MAX_RETRY:
      STREAM_MIN_IDLE_MS:
      STREAM_NAME:
      STREAM_RECLAIM_BATCH:
      STREAM_RECLAIM_INTERVAL_MS:
      TESTER_SEED_ENABLED:
      TESTER_SEED_PASSWORD:
      TRAINING_CAPTURE_ENABLED:
      TRAINING_EXPORT_BATCH_SIZE:
      TRAINING_EXPORT_ENABLED:
      TRAINING_EXPORT_EXCLUDE_TEST_ACCOUNTS:
      TRAINING_EXPORT_OUTPUT_DIR:
      TRAINING_EXPORT_TEST_EMAIL_DOMAINS:
      TRAINING_EXPORT_USER_REF_SALT:
      TRIP_POLL_INTERVAL_MS:
      TRIP_POLL_TIMEOUT_SECONDS:
      USER_INTERNAL_TRUSTED_CIDRS:
      USER_RATELIMIT_TRUSTED_PROXIES:
      VISION_DAILY_LIMIT:
      VISION_INTERNAL_TOKEN:
      WEATHER_WATCH_ENABLED:
      WEATHER_WATCH_INITIAL_DELAY_MS:
      WEATHER_WATCH_INTERVAL_MS:
      # 컨테이너 상한의 70%를 힙으로 쓴다. 나머지 30%는 스레드 스택·메타스페이스·
      # 네이티브 버퍼 몫이다. 지정하지 않으면 기본 25%가 적용된다.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"
    profiles: ["backend", "full"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # agent — LLM/그래프 추론 애플리케이션.
  # postgres 와 hub 가 살아있는지 확인한 뒤 기동된다.
  # hub 는 service_started 만 보장(자체 health 의존성 없음).
  # ports: 호스트 8000 → 컨테이너 8000 (FastAPI /health)
  agent:
    build:
      context: ../map-service-agent
    container_name: map-service-agent
    environment:
      AUTH_ENFORCED:
      CANDIDATES_MAX_BASE:
      CANDIDATES_PER_DAY:
      CHECKPOINT_ENABLED:
      CHECKPOINT_ENC_ACTIVE_KID:
      CHECKPOINT_ENC_KEYS:
      GEMINI_API_KEY:
      GEMINI_HTTP_TIMEOUT_SECONDS:
      GEMINI_MAX_CALLS_PER_REQUEST:
      GEMINI_MAX_OUTPUT_TOKENS:
      GEMINI_MODEL:
      GEMINI_RETRY_ATTEMPTS:
      GEMINI_RETRY_INITIAL_DELAY:
      GEMINI_RETRY_MAX_DELAY:
      GEMINI_RETRY_STATUS_CODES:
      GEMINI_RPD_CAP:
      GEMINI_RPD_LIMIT:
      GEMINI_RPM_LIMIT:
      GEMINI_TEMPERATURE:
      GEMINI_THINKING_BUDGET:
      GEMINI_TIMEOUT_SECONDS:
      HUB_BASE_URL:
      HUB_TIMEOUT_SECONDS:
      INTERNAL_SERVICE_TOKEN:
      JOB_TIMEOUT_SECONDS:
      LANGGRAPH_SCHEMA:
      LOCATION_WIRE_KEY:
      LOG_LEVEL:
      PERSONALIZATION_ENABLED:
      POSTGRES_DB:
      POSTGRES_HOST:
      POSTGRES_PASSWORD:
      POSTGRES_PORT:
      POSTGRES_USER:
      REDIS_DB_RATELIMIT:
      REDIS_DB_STREAMS:
      REDIS_URL:
      REVIEWS_DISPLAY:
      REVIEWS_ENRICH_ENABLED:
      REVIEWS_FETCH_CAP_PER_JOB:
      REVIEWS_MAX_PLACES:
      RULES_ENABLED:
      SEGMENT_STATS_PATH:
      SHUTDOWN_GRACE_SECONDS:
      STATUS_STREAM_MAXLEN:
      STATUS_STREAM_NAME:
      STREAM_MAXLEN:
      STREAM_NAME:
      SUMMARY_ENABLED:
      SUMMARY_MAX_LLM_CALLS:
      SUMMARY_MAX_PLACES:
      TIMELINE_BUFFER_MINUTES:
      TIMELINE_ENABLED:
      TRAINING_CAPTURE_ENABLED: ${TRAINING_CAPTURE_ENABLED:-false}
    <<: *default-logging
    restart: unless-stopped
    # 종료 신호를 받고 정리할 시간을 넉넉히 준다. 이 서비스는 진행 중인
    # 생성 작업을 기다렸다가 못 끝낸 것에 실패를 알리고 나가도록 되어
    # 있는데, 기본값 10초는 그 절차를 중간에 끊는다. 끊기면 기다리던
    # 쪽은 아무 통지도 못 받고 시간 초과까지 그대로 매달린다.
    # 할 일이 없으면 곧바로 나가므로 평소 배포가 느려지지는 않는다.
    stop_grace_period: 320s
    # 유휴 약 100MiB. 모델 호출은 원격이라 프로세스 안에 모델이 없다.
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 512m
    profiles: ["backend", "full"]
    depends_on:
      postgres:
        condition: service_healthy
      hub:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # 세어 둔 성향별 저장 비율. 자료가 쌓이면 다시 만들어 갈아 끼운다.
      # 없어도 그만이라 읽기 전용으로 붙이고, 못 읽으면 랭킹은 예전대로 돈다.
      - ./segstats:/app/segstats:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3).status==200 else 1)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      # 저장소에 처음 붙는 동안의 실패는 세지 않는다.
      start_period: 20s

  # hub — 외부 데이터 게이트웨이 애플리케이션.
  # postgres / redis 가 살아있어야 기동된다.
  # 컨테이너 내부의 8000 포트를 호스트 8001 로 노출하여
  # agent / user 의 8000 / 8080 과 충돌하지 않게 한다.
  hub:
    build:
      context: ../map-service-hub
    container_name: map-service-hub
    <<: *default-logging
    environment:
      AIRKOREA_CACHE_TTL_SEC:
      AIRKOREA_FAIL_CACHE_TTL_SEC:
      AIRKOREA_NUMOFROWS:
      AIRKOREA_REQUEST_TIMEOUT_SEC:
      AIRKOREA_SERVICE_KEY:
      AIR_MAX_AGE_HOURS:
      AUTH_ENFORCED:
      DURUNUBI_GPX_TIMEOUT_SEC:
      DURUNUBI_NUMOFROWS:
      DURUNUBI_RADIUS_M:
      DURUNUBI_REQUEST_TIMEOUT_SEC:
      DURUNUBI_SYNC_INTERVAL_HOURS:
      GOOGLE_MAPS_API_KEY:
      GOOGLE_PHOTOS_DAILY_MEDIA_CAP:
      GOOGLE_PHOTOS_MAX_COUNT:
      GOOGLE_PHOTOS_MAX_WIDTH_PX:
      GOOGLE_PHOTOS_TOTAL_BUDGET_SEC:
      GOOGLE_PLACEID_CACHE_TTL_SEC:
      GOOGLE_PLACEID_NEG_CACHE_TTL_SEC:
      GOOGLE_PLACES_BIAS_RADIUS_M:
      GOOGLE_PLACES_TIMEOUT_SEC:
      HUB_DATABASE_URL:
      HUB_INTERNAL_TRUSTED_CIDRS:
      INTERNAL_SERVICE_TOKEN:
      KAKAO_CACHE_TTL_SEC:
      KAKAO_DEFAULT_RADIUS_M:
      KAKAO_DEFAULT_SIZE:
      KAKAO_REQUEST_TIMEOUT_SEC:
      KAKAO_REST_API_KEY:
      KMA_NUMOFROWS:
      KMA_POLL_INTERVAL_SEC:
      KMA_RATE_LIMIT_SLEEP_SEC:
      KMA_REQUEST_TIMEOUT_SEC:
      KMA_RETRY_INTERVAL_SEC:
      KMA_RETRY_MAX_DURATION_SEC:
      KMA_SERVICE_KEY:
      LOCATION_WIRE_KEY:
      LOG_LEVEL:
      NAVER_BLOG_CACHE_TTL_SEC:
      NAVER_BLOG_DEFAULT_DISPLAY:
      NAVER_BLOG_TIMEOUT_SEC:
      NAVER_CLIENT_ID:
      NAVER_CLIENT_SECRET:
      ODSAY_API_KEY:
      ODSAY_API_KEY_FALLBACK:
      ODSAY_CACHE_COORD_DIGITS:
      ODSAY_CACHE_TTL_SEC:
      ODSAY_DAILY_CALL_CAP:
      ODSAY_FAIL_CACHE_TTL_SEC:
      ODSAY_REQUEST_TIMEOUT_SEC:
      ODSAY_TOTAL_BUDGET_SEC:
      OSRM_BICYCLE_BASE_URL:
      OSRM_FOOT_BASE_URL:
      OSRM_TIMEOUT_SEC:
      PLACES_STUB_MODE:
      PM_CACHE_TTL_SEC:
      PM_DEFAULT_RADIUS_M:
      PM_FAIL_CACHE_TTL_SEC:
      PM_NUMOFROWS:
      PM_PROVIDERS:
      PM_REQUEST_TIMEOUT_SEC:
      PM_SERVICE_KEY:
      PM_TOTAL_BUDGET_SEC:
      REDIS_DB_CACHE:
      REDIS_URL:
      ROUTE_CACHE_TTL_SEC:
      ROUTE_MAX_POINTS:
      SEOUL_BIKE_CACHE_TTL_SEC:
      SEOUL_BIKE_DEFAULT_RADIUS_M:
      SEOUL_BIKE_MAX_PAGES:
      SEOUL_BIKE_PAGE_SIZE:
      SEOUL_BIKE_PARTIAL_CACHE_TTL_SEC:
      SEOUL_BIKE_REQUEST_TIMEOUT_SEC:
      SEOUL_BIKE_TOTAL_BUDGET_SEC:
      SEOUL_OPENAPI_KEY:
      TOUR_API_SERVICE_KEY:
      TRANSIT_BUS_DOMINANCE_RATIO:
      WEATHER_NOW_CACHE_TTL_SEC:
      WEATHER_NOW_ENRICH_BUDGET_SEC:
      WEATHER_NOW_MAX_AGE_HOURS:
      WEATHER_NOW_OBSERVATION_BUDGET_SEC:
      WEATHER_SNAPSHOT_RETENTION_DAYS:
    restart: unless-stopped
    # 유휴 약 115MiB. 외부 응답을 메모리에 오래 들고 있지 않는다.
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 512m
    profiles: ["backend", "full"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3).status==200 else 1)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      # 저장소에 처음 붙는 동안의 실패는 세지 않는다.
      start_period: 20s

  # yolo — 카메라 실시간 인식 서비스 (YOLO 추론 + Gemini Vision 식별).
  # 클라이언트가 WebSocket(/ws/vision)으로 프레임을 보내면 객체를 찾아
  # 무엇인지 설명해 돌려준다. User permit이 실패하면 인증/작업을 거절한다.
  # YOLO 가중치는 이미지 빌드 시 내장되므로 기동에 네트워크가 필요 없다.
  #
  # 프로파일을 vision 으로 분리한 이유: 이미지에 torch 가 들어가 무겁고,
  # 카메라 기능을 쓰지 않는 백엔드 개발에는 필요하지 않다.
  #   docker compose --profile vision up -d yolo
  #
  # environment 로 네 키를 덮어쓰는 이유: agent 와 GEMINI_TIMEOUT_SECONDS ·
  # JOB_TIMEOUT_SECONDS 를 같은 이름·다른 의미로 쓴다(agent 100/300초, yolo
  # 25/45초). 공유 .env 에 agent 튜닝값이 들어가면 yolo 가 그대로 물려받으므로
  # VISION_* 키로 갈라 둔다(environment 가 env_file 보다 우선한다).
  # 전체 한도가 식별 한도보다 커야 한다 — 같으면 식별을 마치고도 검색 도중
  # 잘려 이미 얻은 결과가 통째로 버려진다.
  # VISION_GEMINI_API_KEY 가 비어 있으면 공용 GEMINI_API_KEY 를 쓴다 — agent 의
  # 호출 한도 계산과 분리하려면 별도 키를 발급해 .env 에 채운다.
  #
  # ports: 호스트 8004 → 컨테이너 8000. 루프백 직결은 점검용이고,
  #        클라이언트가 실제로 쓰는 공개 경로는 proxy(8090)의 /ws/vision 이다.
  yolo:
    build:
      context: ../map-service-yolo
    container_name: map-service-yolo
    <<: *default-logging
    environment:
      GEMINI_MODEL:
      KAKAO_REST_API_KEY:
      LOG_LEVEL:
      YOLO_CONFIDENCE:
      YOLO_MODEL_PATH:
      GEMINI_API_KEY: ${VISION_GEMINI_API_KEY:-${GEMINI_API_KEY:-}}
      GEMINI_TIMEOUT_SECONDS: ${VISION_GEMINI_TIMEOUT_SECONDS:-25.0}
      JOB_TIMEOUT_SECONDS: ${VISION_JOB_TIMEOUT_SECONDS:-45.0}
      WS_MAX_JOBS_PER_CONNECTION: ${VISION_WS_MAX_JOBS:-60}
      VISION_INTERNAL_TOKEN: ${VISION_INTERNAL_TOKEN:?전용 Vision 승인 토큰이 필요하다}
      USER_SERVICE_BASE_URL: ${USER_SERVICE_BASE_URL:-http://user:8080}
      VISION_PERMIT_TIMEOUT_SECONDS: ${VISION_PERMIT_TIMEOUT_SECONDS:-5}
      VISION_MAX_CONCURRENT_JOBS: ${VISION_MAX_CONCURRENT_JOBS:-2}
      WS_IDLE_TIMEOUT_SECONDS: ${WS_IDLE_TIMEOUT_SECONDS:-120}
      WS_MAX_MESSAGES_PER_CONNECTION: ${WS_MAX_MESSAGES_PER_CONNECTION:-240}
    restart: unless-stopped
    # torch 와 가중치를 프로세스 안에 올린다. 다른 서비스보다 한 자리 크다.
    deploy:
      resources:
        limits:
          cpus: "2.0"  # 코어 수를 넘는 상한은 2코어 서버에서 생성이 거절된다
          memory: 3g
    profiles: ["vision"]
    ports:
      - "127.0.0.1:8004:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      # torch 를 불러오고 YOLO 모델을 올리는 데 시간이 걸려 유예를 크게 둔다.
      start_period: 30s

  # proxy — 바깥으로 열 때 앞에 세우는 유일한 관문 (nginx).
  # 설정은 ./proxy/default.conf 에 있다. 여는 경로를 목록으로 못박고(그 밖은
  # 404), 운영 지표 경로를 막고, 일정 생성에 IP 당 호출 상한을 건다.
  #
  # BFF 를 그대로 노출하지 않는 이유: BFF 는 자기 상태 점검 경로를 인증 없이
  # 열어 두고, 무거운 생성 요청에도 자체 호출 상한이 없다. 공개 주소로 그
  # 두 가지가 그대로 나가면 지표가 새고 생성 쿼터가 남용된다.
  #
  # 컨테이너 이름으로 BFF 를 찾으므로(user:8080) BFF 도 컨테이너로 떠 있어야
  # 한다. 호스트에서 BFF 를 직접 띄우는 흐름과는 같이 쓸 수 없다.
  # yolo 는 vision 프로파일이라 없을 수 있는데, default.conf 가 그 경로만
  # 요청 시점에 이름을 풀도록 짜여 있어 proxy 기동에는 영향이 없다.
  #
  # ports: 호스트 8090 → 컨테이너 80. 루프백에만 붙인다 — 바깥 노출은 이
  # 포트를 터널이 집어 가는 방식이고, 열린 포트를 그대로 두지 않는다.
  proxy:
    <<: *default-logging
    image: nginx:alpine
    container_name: map-service-proxy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
    restart: unless-stopped
    # 유휴 약 10MiB. 레이트리밋 존 세 개가 각각 10m 를 차지한다.
    profiles: ["backend", "full"]
    depends_on:
      - user
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8090:80"
    # 127.0.0.1 을 직접 쓴다. localhost 는 IPv6 로 풀릴 수 있는데 nginx 는
    # IPv4 로만 듣고 있어 점검이 통과하지 못한다.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q ok || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

# volumes — 호스트와 분리된 영속 스토리지.
# postgres-data: RDB 데이터 디렉터리 (/var/lib/postgresql/data)
# redis-data:    redis appendonly 디렉터리 (/data)
# osrm-data:     osrm-rebuild.sh 가 적재한 /foot·/bicycle/korea.osrm* (고정 이름).
#
# 실제 볼륨 이름을 map_ 접두로 고정해 둔다. 프로젝트명이 map 이던 시절에 만든
# 볼륨을 그대로 계속 쓰기 위해서다. 고정하지 않으면 프로젝트명이 바뀐 순간
# 새 빈 볼륨이 생기고 기존 데이터가 보이지 않게 된다.
volumes:
  postgres-data:
    name: map_postgres-data
  redis-data:
    name: map_redis-data
  osrm-data:
    name: osrm-data

# networks — 두 스택이 공유하는 브리지 네트워크. 이 파일이 소유자다.
# 서비스 간 통신은 컨테이너 이름이 아니라 서비스 이름(postgres, redis, hub …)으로
# DNS 해석된다 — container_name 을 고정해도 이 이름은 그대로다.
networks:
  default:
    name: map-net
