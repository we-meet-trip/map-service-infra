# map 서비스 전체 컨테이너 오케스트레이션 정의 파일.
#
# project name: map (모든 컨테이너·네트워크·볼륨 prefix 로 사용된다)
#
# 프로파일 구성:
#   infra   — 인프라 컨테이너만 (postgres / redis)
#   backend — 애플리케이션 컨테이너 (user / agent / hub / admin)
#   full    — 모든 컨테이너 (postgres / redis / user / agent / hub / admin)
#   routing — 경로 라우팅 엔진 (osrm-foot / osrm-bicycle). full 에 포함되지 않는
#             별도 프로파일이다. OSRM 데이터(scripts/osrm-rebuild.sh)를 빌드한
#             뒤에만 기동한다. hub 는 이 서비스에 depends_on 을 걸지 않으며,
#             미기동/미설정 시 결정적 스텁 지오메트리로 폴백한다.
#   프로파일에 속하지 않는 서비스는 `docker compose up` 시 기동되지 않는다.
#
# 환경 변수:
#   x-app-env 앵커가 ./.env 파일을 읽어 user / agent / hub 컨테이너에 주입한다.
#   postgres 의 POSTGRES_* 변수는 동일한 .env 에서 치환된다.
#
# 네트워크: 모든 서비스는 map-net 단일 브리지 네트워크에 연결된다.
# 포트는 보안상 127.0.0.1 루프백에만 바인딩한다.

name: map

# x-app-env — 애플리케이션 컨테이너 공통 환경설정.
# user / agent / hub 모두 동일 .env 파일을 공유한다.
x-app-env: &app-env
  env_file: ./.env

services:
  # postgres — PostGIS 확장이 포함된 메인 RDB.
  # init 디렉터리(./db/init)의 SQL 을 최초 부팅 시 자동 실행하여
  # hub_data 등 스키마를 사전 생성한다.
  # ports: 호스트 5432 (루프백) → 컨테이너 5432
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    profiles: ["infra", "full"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # db/init/10-admin.sh 가 map_admin 읽기전용 역할을 만들 때 사용.
      # admin 컨테이너의 ADMIN_DATABASE_URL 비밀번호와 반드시 일치.
      MAP_ADMIN_PASSWORD: ${MAP_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6

  # redis — L1 캐시 / 단기 키-값 저장소.
  # appendonly 모드로 지속화하여 재기동 시 데이터를 유지한다.
  # ports: 호스트 16379 → 컨테이너 6379 (호스트 측 충돌 회피용 매핑)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["infra", "full"]
    # REDIS_PASSWORD 가 비어 있으면(현행) 무인증으로 기동한다.
    # 값이 설정되면 --requirepass 로 인증을 켜고 healthcheck 도 -a 로 인증한다.
    # $$ 는 compose 치환이 아니라 컨테이너 shell 확장(런타임)을 의미한다.
    command: ["sh", "-c", "redis-server --appendonly yes $${REDIS_PASSWORD:+--requirepass $$REDIS_PASSWORD}"]
    # redis 는 x-app-env 앵커를 쓰지 않으므로 REDIS_PASSWORD 를 .env 에서 명시 주입.
    environment:
      - REDIS_PASSWORD
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a $$REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  # osrm-foot — 도보 라우팅 엔진.
  # scripts/osrm-rebuild.sh 가 named volume osrm-data 의 /foot/korea.osrm 로
  # 사전 빌드한 그래프를 read-only 로 마운트해 osrm-routed(MLD)로 서빙한다.
  # profiles: ["routing"] — full 에 포함되지 않는다. 데이터 빌드 후에만 기동.
  # ports: 호스트 5000 → 컨테이너 5000 (osrm-routed 기본 포트, 루프백 바인딩)
  osrm-foot:
    image: ghcr.io/project-osrm/osrm-backend:v26.5.0-amd64-alpine
    restart: unless-stopped
    # osrm-backend 는 amd64 전용(arm64 미제공). arm64 호스트(Apple Silicon)는
    # 아래 platform 으로 amd64 에뮬레이션 실행된다. 프로덕션 amd64 서버는 네이티브.
    platform: linux/amd64
    profiles: ["routing"]
    command: ["osrm-routed", "--algorithm", "mld", "/data/foot/korea.osrm"]
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - osrm-data:/data:ro

  # osrm-bicycle — 자전거 라우팅 엔진.
  # foot 과 동일 빌드 절차의 /bicycle/korea.osrm 을 읽는다(같은 named volume 공유).
  # ports: 호스트 5001 → 컨테이너 5000 (foot 과 호스트 포트만 다르다)
  osrm-bicycle:
    image: ghcr.io/project-osrm/osrm-backend:v26.5.0-amd64-alpine
    restart: unless-stopped
    platform: linux/amd64
    profiles: ["routing"]
    command: ["osrm-routed", "--algorithm", "mld", "/data/bicycle/korea.osrm"]
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - osrm-data:/data:ro

  # user — BFF(Backend For Frontend) 애플리케이션.
  # 인접 디렉터리(../map-service-user)의 Dockerfile 로 빌드된다.
  # postgres / redis 의 healthcheck 통과를 기다린 후 기동된다.
  # ports: 호스트 8080 → 컨테이너 8080 (actuator/health 헬스체크)
  user:
    build:
      context: ../map-service-user
    <<: *app-env
    restart: unless-stopped
    profiles: ["backend", "full"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # agent — LLM/그래프 추론 애플리케이션.
  # postgres 와 hub 가 살아있는지 확인한 뒤 기동된다.
  # hub 는 service_started 만 보장(자체 health 의존성 없음).
  # ports: 호스트 8000 → 컨테이너 8000 (FastAPI /health)
  agent:
    build:
      context: ../map-service-agent
    <<: *app-env
    restart: unless-stopped
    profiles: ["backend", "full"]
    depends_on:
      postgres:
        condition: service_healthy
      hub:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # hub — 외부 데이터 게이트웨이 애플리케이션.
  # postgres / redis 가 살아있어야 기동된다.
  # 컨테이너 내부의 8000 포트를 호스트 8001 로 노출하여
  # agent / user 의 8000 / 8080 과 충돌하지 않게 한다.
  hub:
    build:
      context: ../map-service-hub
    <<: *app-env
    restart: unless-stopped
    profiles: ["backend", "full"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # admin — 운영 콘솔 JSON API 서버 (cut 2).
  # hub_data 직접 RO + admin_data 소유 RW(감사/계정/세션) + Redis 진단 RO
  # + hub/BFF `/internal` 위임. UI 는 별도 SPA(admin-web)가 담당한다.
  # 기동 시 entrypoint 가 alembic upgrade head(admin_data) 후 uvicorn 을 띄운다.
  # 인증은 admin_accounts(bcrypt)+세션쿠키(단일 공유 Basic 폐지).
  # ports: 호스트 8002 → 컨테이너 8000 (loopback).
  admin:
    build:
      context: ../map-service-admin
    <<: *app-env
    restart: unless-stopped
    profiles: ["backend", "full"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8002:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      # 기동 시 alembic 마이그레이션이 선행하므로 여유를 둔다.
      start_period: 45s

  # admin-web — 운영 콘솔 SPA (React/Vite → nginx 정적 서빙).
  # nginx 가 정적 자산을 서빙하고 /api/ 를 admin:8000 으로 리버스 프록시한다
  # (same-origin → 세션 쿠키 그대로 전달, 프로덕션은 CORS 불필요).
  # ports: 호스트 8003 → 컨테이너 80 (loopback). node/nginx alpine 은 멀티아치
  # 이미지라 amd64·arm64 호스트 어디서든 빌드된다.
  admin-web:
    build:
      context: ../map-service-admin/web
    restart: unless-stopped
    profiles: ["backend", "full"]
    depends_on:
      - admin
    ports:
      - "127.0.0.1:8003:80"

  # ===== 모니터링 스택 (profile "monitoring") =====================
  # full 에 미포함 — Pi 4(8GB) 메모리 여유 운용 위해 별도 기동한다:
  #   docker compose --profile full --profile monitoring up -d
  # 전 포트 loopback. 이미지는 모두 multi-arch(arm64 OK).

  # prometheus — 메트릭 수집/저장. 보존기간/크기를 Pi 에 맞게 제한한다.
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=10d"
      - "--storage.tsdb.retention.size=2GB"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  # grafana — 대시보드. 데이터소스/대시보드는 코드로 프로비저닝된다.
  # 임베드 허용 + anonymous Viewer(loopback 전제) — admin 콘솔 iframe 용.
  grafana:
    image: grafana/grafana-oss:11.2.0
    restart: unless-stopped
    profiles: ["monitoring"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    # 호스트 포트는 GRAFANA_PORT(.env)로 재정의 가능(기본 3000). 로컬에서 3000이
    # 다른 프로세스에 점유된 경우 GRAFANA_PORT=3001 등으로 우회한다.
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"

  # postgres-exporter — Postgres 메트릭(pg_stat_*). 슈퍼유저 DSN 사용.
  # depends_on 을 걸지 않는다(postgres 는 full 프로파일 — 교차 프로파일 결합
  # 방지). exporter 는 대상 미기동 시 스크레이프만 실패하고 자동 재접속한다.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"

  # redis-exporter — Redis 메트릭(메모리/클라이언트/키스페이스).
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

  # node-exporter — 호스트 자원(CPU/메모리/디스크). Pi 자원 감시.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - /:/host:ro,rslave

# volumes — 호스트와 분리된 영속 스토리지.
# postgres-data: RDB 데이터 디렉터리 (/var/lib/postgresql/data)
# redis-data:    redis appendonly 디렉터리 (/data)
# osrm-data:     osrm-rebuild.sh 가 적재한 /foot·/bicycle/korea.osrm* (고정 이름).
# prometheus-data / grafana-data: 모니터링 스택 영속 스토리지.
volumes:
  postgres-data:
  redis-data:
  osrm-data:
    name: osrm-data
  prometheus-data:
  grafana-data:

# networks — 모든 서비스가 공유하는 기본 브리지 네트워크.
# 서비스 간 통신은 컨테이너 이름(예: postgres, redis, hub)으로 DNS 해석된다.
networks:
  default:
    name: map-net
