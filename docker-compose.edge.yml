# 바깥에서 들어오는 자리. 기본 파일과 함께 쓴다.
#
#   docker compose --env-file ./.env \
#     -f docker-compose.yml -f docker-compose.edge.yml \
#     --profile full --profile edge up -d
#
# 지금까지는 맥에서 터널을 띄워 바깥과 이었다. 그 방식은 주소가 열 때마다
# 달라지고 맥이 잠들면 함께 끊기므로, 늘 켜 두는 서버에는 쓸 수 없다.
# 여기서는 서버 자신이 인증서를 받아 https 로 받는다.
#
# 관문(nginx)은 그대로 둔다. 바꾸면 경로 허용목록과 요청 상한이 함께 흔들린다.
# 대신 이 앞단이 관문 뒤로 넘겨 주기만 한다.
#
# 한 가지 주의할 점이 있다. 관문은 실제 요청자 주소를 CF-Connecting-IP 에서
# 읽는다. 앞단이 그 헤더를 채우지 않으면 모든 요청이 앞단의 주소 하나로
# 보이고, 그러면 분당 상한이 사용자마다가 아니라 전체 하나로 걸린다 —
# 한 사람이 상한을 채우면 나머지 전원이 함께 막힌다. 그래서 아래에서
# 그 헤더를 앞단이 직접 채운다.

services:
  edge:
    image: caddy:2-alpine
    container_name: !reset null
    restart: unless-stopped
    profiles: ["edge"]
    # 인증서를 받으려면 발급처가 이 서버의 80 번으로 들어올 수 있어야 한다.
    # 다른 포트와 달리 이 둘만 바깥으로 연다.
    ports:
      - "80:80"
      - "443:443"
    environment:
      EDGE_DOMAIN: ${EDGE_DOMAIN:?바깥에서 부를 주소를 정해야 한다}
      EDGE_EMAIL: ${EDGE_EMAIL:?인증서 만료 알림을 받을 주소를 정해야 한다}
    volumes:
      - ./edge/Caddyfile:/etc/caddy/Caddyfile:ro
      - edge-data:/data
      - edge-config:/config
    depends_on:
      - proxy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m

volumes:
  edge-data:
    name: ${COMPOSE_PROJECT_NAME:-map}_edge-data
  edge-config:
    name: ${COMPOSE_PROJECT_NAME:-map}_edge-config
