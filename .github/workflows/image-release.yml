# One successful run produces one verified, immutable six-image deployment bundle.
# Infra develop push -> ci success -> image-release -> receiver/deploy workflow.
name: image-release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "공통 소스 branch/tag (모든 저장소에 있어야 함)"
        type: string
        required: true
        default: develop
      tag:
        description: "새 이미지 태그. 비우면 날짜-run ID-attempt (latest 금지)"
        type: string
        default: ""
  workflow_run:
    workflows: [ci]
    branches: [develop]
    types: [completed]
  repository_dispatch:
    types: [release-develop]

concurrency:
  group: image-release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_REGISTRY: ghcr.io/we-meet-trip

jobs:
  release:
    if: >-
      github.repository == 'we-meet-trip/map-service-infra' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'repository_dispatch' && github.event.action == 'release-develop') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'develop' &&
       github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      # The validating tool belongs to the executing workflow, not arbitrary input code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          persist-credentials: false

      - name: validate release inputs
        id: inputs
        env:
          SOURCE_REF: ${{ inputs.ref || 'develop' }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            tag="$(TZ=Asia/Seoul date +%Y-%m-%d)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          python3 release-tools/scripts/release_manifest.py validate-inputs --ref "$SOURCE_REF" --tag "$tag"
          echo "ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: verify source CI dispatch
        if: github.event_name == 'repository_dispatch'
        id: dispatch
        run: |
          set -euo pipefail
          python3 release-tools/scripts/release_manifest.py verify-dispatch \
            --event-file "$GITHUB_EVENT_PATH" \
            --output "$RUNNER_TEMP/map-source-ci.json" --github-output "$GITHUB_OUTPUT"

      - name: checkout source snapshots
        id: src
        env:
          SOURCE_REF: ${{ steps.inputs.outputs.ref }}
          CI_INFRA_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_EVENT: ${{ github.event_name }}
          DISPATCH_REPOSITORY: ${{ steps.dispatch.outputs.repository }}
          DISPATCH_SHA: ${{ steps.dispatch.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p src
          for service in infra user agent hub yolo admin; do
            dir="src/map-service-$service"
            git init -q "$dir"
            git -C "$dir" remote add origin "https://github.com/we-meet-trip/map-service-$service.git"
            ref="$SOURCE_REF"
            if [ "$service" = infra ] && [ "$RELEASE_EVENT" = workflow_run ]; then
              ref="$CI_INFRA_SHA"
            fi
            if [ "$RELEASE_EVENT" = repository_dispatch ] && \
               [ "we-meet-trip/map-service-$service" = "$DISPATCH_REPOSITORY" ]; then
              ref="$DISPATCH_SHA"
            fi
            git -C "$dir" fetch -q --depth 1 origin "$ref"
            git -C "$dir" checkout -q --detach FETCH_HEAD
            sha="$(git -C "$dir" rev-parse HEAD)"
            echo "$service=$sha" >> "$GITHUB_OUTPUT"
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: validate exact source snapshots
        run: |
          set -euo pipefail
          (cd release-tools && python -m unittest discover -s tests -v)
          (cd src/map-service-infra && python -m unittest discover -s tests -v)
          (cd src/map-service-user && ./gradlew --no-daemon clean test)
          for service in agent hub yolo admin; do
            (
              cd "src/map-service-$service"
              python -m venv .venv
              .venv/bin/python -m pip install -q --upgrade pip
              if [ "$service" = yolo ]; then
                .venv/bin/python -m pip install -q --index-url https://download.pytorch.org/whl/cpu torch torchvision
                .venv/bin/python -m pip freeze | grep -E '^(torch|torchvision)==' > /tmp/map-release-torch-constraints.txt
                export PIP_CONSTRAINT=/tmp/map-release-torch-constraints.txt
              fi
              if [ -f requirements-dev.txt ]; then
                .venv/bin/python -m pip install -q -r requirements.txt -r requirements-dev.txt
              else
                .venv/bin/python -m pip install -q -r requirements.txt pytest
              fi
              .venv/bin/python -m pip check
              .venv/bin/python -m pytest -q
            )
          done

      - uses: docker/setup-buildx-action@v3
      - name: registry login
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: require unused release tag
        env:
          IMAGE_TAG: ${{ steps.inputs.outputs.tag }}
        run: |
          set -euo pipefail
          for service in user agent hub yolo admin admin-web; do
            if docker buildx imagetools inspect "$IMAGE_REGISTRY/map-service-$service:$IMAGE_TAG" >/dev/null 2>&1; then
              echo "Release tag already exists; choose a new tag." >&2
              exit 1
            fi
          done

      - name: build and push six images
        working-directory: src/map-service-infra
        env:
          IMAGE_TAG: ${{ steps.inputs.outputs.tag }}
          IMAGE_PLATFORM: linux/amd64
        run: ./scripts/images-push.sh

      - name: verify OCI provenance and create digest bundle
        env:
          IMAGE_TAG: ${{ steps.inputs.outputs.tag }}
          SOURCE_REF: ${{ steps.inputs.outputs.ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RELEASE_EVENT: ${{ github.event_name }}
          INFRA_SHA: ${{ steps.src.outputs.infra }}
        run: |
          set -euo pipefail
          dispatch=()
          if [ "$RELEASE_EVENT" = repository_dispatch ]; then
            dispatch=(--dispatch-evidence "$RUNNER_TEMP/map-source-ci.json")
          fi
          python release-tools/scripts/release_manifest.py create \
            --source-root src --output release-bundle --tag "$IMAGE_TAG" \
            --source-ref "$SOURCE_REF" --run-id "$GITHUB_RUN_ID" \
            --workflow-repository "$GITHUB_REPOSITORY" --workflow-sha "$WORKFLOW_SHA" \
            --event-name "$RELEASE_EVENT" "${dispatch[@]}"
          python release-tools/scripts/release_manifest.py verify \
            --bundle release-bundle --expected-run-id "$GITHUB_RUN_ID" \
            --expected-infra-sha "$INFRA_SHA" --expected-workflow-sha "$WORKFLOW_SHA"

      # Scan the immutable registry references from the already verified bundle.
      # This scanner belongs to workflow_sha, not a source-ref-provided script.
      - name: scan six exact registry images
        id: registry_audit
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
        run: |
          python3 release-tools/scripts/scan_release_images.py scan \
            --bundle release-bundle --output release-image-audit \
            --cache "$RUNNER_TEMP/map-release-trivy" --github-summary "$GITHUB_STEP_SUMMARY"

      - name: retain exact image security evidence
        if: ${{ always() && steps.registry_audit.outcome != 'skipped' && steps.registry_audit.outcome != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-image-security-audit
          path: release-image-audit/
          if-no-files-found: error
          retention-days: 90

      # Publish no deployable bundle after an incomplete scan or CRITICAL finding.
      # HIGH remains FINDINGS_REQUIRE_REVIEW; GCP testing is not NCP acceptance.
      - name: enforce critical vulnerability gate
        run: |
          python3 release-tools/scripts/scan_release_images.py enforce \
            --bundle release-bundle --output release-image-audit

      - name: upload verified release bundle
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: |
            release-bundle/release.json
            release-bundle/compose.images.yml
            release-bundle/compose.admin-images.yml
            release-bundle/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

      - name: release summary
        env:
          IMAGE_TAG: ${{ steps.inputs.outputs.tag }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          {
            echo "Release: $IMAGE_TAG"
            echo "Artifact: $ARTIFACT_URL"
            echo "Artifact SHA256: $ARTIFACT_DIGEST"
            echo 'Deploy using the digest-pinned bundle; mutable image tags are not deployment inputs.'
          } >> "$GITHUB_STEP_SUMMARY"
