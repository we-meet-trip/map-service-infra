# 운영 VM 에서 서비스 스택(map-prod)과 한 기계를 나눠 쓰는 관리자 스택.
#
# docker-compose.admin.yml 을 덧칠하지 않는 독립 파일이다. 그 파일의 빌드 자리,
# 고정 컨테이너 이름, monitoring 프로필, 공유 map-net 가정을 하나도 물려받지
# 않는다. 이미지는 전부 @sha256 고정값으로만 받는다.
#
# 네트워크 세 갈래:
#   admin-control  control DB 전용 내부망. 바깥으로 나가는 길이 없다.
#   admin-web      화면(nginx)과 관리 API 사이만 잇는다.
#   map-prod-net   서비스 스택 소유(외부). 관리 API 하나만 붙어 user·hub·agent 를
#                  서비스 이름으로 찾는다. 이 스택은 그 망을 만들거나 지우지 않는다.
# 같은 망 위에서 이름이 겹치면 DNS 가 두 컨테이너를 섞어 돌려준다. 그래서 이
# 스택의 서비스 이름과 별칭에는 서비스 스택의 이름(postgres·redis·user·hub·agent·
# proxy·edge 등)을 쓰지 않는다.
#
# 순서: 서비스 스택이 map-prod-net 을 만든 뒤에 올리고, 내릴 때는 이 스택부터.
# env_file 의 format: raw 는 Docker Compose v2.30.0 이상에서만 읽힌다.
#
# 빈 control DB 에서 처음 한 번(SQL 두 파일은 관리자 이미지에 들어 있지 않다):
#   1) docker compose --env-file <compose.env> -f docker-compose.admin.prod.yml up -d --wait admin-control-db
#   2) 관리자 저장소 scripts/bootstrap-control-db.sql 을 admin_provisioner 로 실행
#      (map_admin_migrator·map_admin_runtime 역할과 admin_data 스키마를 만든다)
#   3) docker compose --env-file <compose.env> -f docker-compose.admin.prod.yml --profile migration run --rm admin-migrate
#   4) 관리자 저장소 scripts/grant-control-runtime.sql 을 map_admin_migrator 로 실행
#   5) 첫 owner 계정을 한 번만 만든다. 계정이 하나도 없는데 부트스트랩 값이
#      비어 있으면 관리 API 는 기동 단계에서 멈춘다(admin-runtime.env.example 참고).
# 평소 기동:
#   docker compose --env-file <compose.env> -f docker-compose.admin.prod.yml up -d admin admin-web
#
# 렌더 결과(config)에는 env_file 의 비밀값이 그대로 펼쳐진다. 화면이나 증거
# 파일에 원문을 남기지 않는다.

name: map-admin-prod

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # 관리 JSON API. 런타임은 마이그레이션 자격을 받지 않고(ADMIN_RUN_MIGRATIONS=false),
  # 대상 DB·Redis 진단 연결도 두지 않는다. 대상은 env 파일의 ADMIN_TARGETS(prod)
  # 하나이며 API 로만 붙는다.
  admin:
    <<: *default-logging
    image: ${ADMIN_API_IMAGE:?digest-pinned Admin image required}
    restart: unless-stopped
    env_file:
      - path: ${ADMIN_RUNTIME_ENV_FILE:?private runtime-only env file required}
        format: raw
        required: true
    # env 파일에 실수로 들어가도 아래 값이 이긴다.
    environment:
      ADMIN_RUN_MIGRATIONS: "false"
      ADMIN_CONTROL_MIGRATION_DATABASE_URL: ""
      ADMIN_DATABASE_URL: ""
      ADMIN_REDIS_URL: ""
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    ports:
      - "127.0.0.1:8002:8000"
    networks:
      admin-control: {}
      admin-web: {}
      map-prod-net: {}
    depends_on:
      admin-control-db:
        condition: service_healthy
    # control DB 에 활성 owner 계정이 있어야 200 이다.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3).status==200 else 1)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  # 정적 화면 + /api/ 프록시. nginx 설정이 관리 API 를 admin:8000 으로 찾는다.
  admin-web:
    <<: *default-logging
    image: ${ADMIN_WEB_IMAGE:?digest-pinned Admin Web image required}
    restart: unless-stopped
    # 기본 nginx 마스터가 작업 프로세스의 uid/gid 를 바꾸므로 권한은 남겨 둔다.
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.25
    ports:
      - "127.0.0.1:8003:80"
    # 내부망으로 두면 루프백 포트 공개가 붙지 않는다.
    networks:
      admin-web: {}
    depends_on:
      - admin

  # 관리 계정·세션·감사 기록만 담는 전용 DB. 서비스 저장소와 섞이지 않는다.
  admin-control-db:
    <<: *default-logging
    image: ${ADMIN_CONTROL_POSTGRES_IMAGE:?digest-pinned PostgreSQL image required}
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20"]
    environment:
      POSTGRES_DB: admin_control
      POSTGRES_USER: admin_provisioner
      POSTGRES_PASSWORD_FILE: /run/secrets/control_provisioner_password
    secrets: [control_provisioner_password]
    volumes:
      - type: bind
        source: ${ADMIN_CONTROL_DATA_DIR:?pre-created empty control DB data directory required}
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=64m"
      - "/var/run/postgresql:rw,noexec,nosuid,size=16m"
    # 공식 진입점이 데이터 디렉터리 소유자를 맞추고 postgres 사용자로 내려가는 데
    # 필요한 권한만 남긴다.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    networks:
      admin-control: {}
    # 초기화 중의 임시 서버는 소켓만 열어 127.0.0.1 로는 응답하지 않는다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U admin_provisioner -d admin_control"]
      interval: 10s
      timeout: 3s
      retries: 10

  # 1회 작업. 마이그레이션 자격은 이 컨테이너에만 들어간다.
  admin-migrate:
    <<: *default-logging
    image: ${ADMIN_API_IMAGE:?digest-pinned Admin image required}
    profiles: [migration]
    restart: "no"
    entrypoint: ["alembic", "upgrade", "head"]
    env_file:
      - path: ${ADMIN_MIGRATION_ENV_FILE:?private migration-only env file required}
        format: raw
        required: true
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    networks:
      admin-control: {}
    depends_on:
      admin-control-db:
        condition: service_healthy

networks:
  admin-control:
    internal: true
  admin-web: {}
  map-prod-net:
    external: true
    name: map-prod-net

secrets:
  control_provisioner_password:
    file: ${ADMIN_CONTROL_PROVISIONER_PASSWORD_FILE:?private control DB superuser password file required}
