# Reference copy of the dedicated active workflow. Source of execution: .github/workflows/ncp-bootstrap-acceptance.yml
# Dedicated session-A fixture. No NCP resources, shared GCP, receiver or serving changes.
name: NCP empty-host Linux acceptance

on:
  push:
    branches: [feat/ncp-empty-host-bootstrap-20260907]
    paths: ["scripts/ncp-bootstrap-*.py", "deploy/ncp-bootstrap/**", ".github/workflows/ncp-bootstrap-acceptance.yml"]
  workflow_dispatch:
    inputs:
      ubuntu_base:
        description: 'Reviewed official amd64 Ubuntu 24.04 reference: ubuntu@sha256:<64 hex>'
        required: true
        type: string
      docker_key_sha256:
        description: 'Independently reviewed SHA256 of https://download.docker.com/linux/ubuntu/gpg'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ncp-empty-host-linux-acceptance
  cancel-in-progress: false

jobs:
  fixture:
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push') &&
      github.repository == 'we-meet-trip/map-service-infra' &&
      github.event.repository.private == false &&
      startsWith(github.ref, 'refs/heads/feat/ncp-')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout the dispatched commit without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-09-07
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run bounded offline fixtures
        run: python3 -B -m unittest discover -s deploy/ncp-bootstrap -p 'test_*.py' -v
      - name: Download only the reviewed Caddy draft assets and Docker public key
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKER_KEY_SHA256: ${{ inputs.docker_key_sha256 || '1500c1f56fa9e26b9b8f42452a553675796ade0807cdce11975eb98170b3a570' }}
        run: >-
          python3 -B deploy/ncp-bootstrap/linux_acceptance.py download
          --assets "$RUNNER_TEMP/ncp-reviewed-caddy"
          --docker-key-sha256 "$DOCKER_KEY_SHA256"
      - name: Install fixture-only loop and LUKS utilities on this disposable runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cryptsetup-bin e2fsprogs
      - name: Run real systemd, package, secret, Caddy and rollback checks
        env:
          UBUNTU_BASE: ${{ inputs.ubuntu_base || 'ubuntu@sha256:1e0a86e57d247923571b75e0aaf48a1449cf8c543d51fb3e07a4a7d7bfa79316' }}
          DOCKER_KEY_SHA256: ${{ inputs.docker_key_sha256 || '1500c1f56fa9e26b9b8f42452a553675796ade0807cdce11975eb98170b3a570' }}
        run: >-
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_OS,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_SHA,GITHUB_WORKSPACE,RUNNER_TEMP
          python3 -B deploy/ncp-bootstrap/linux_acceptance.py run
          --ubuntu-base "$UBUNTU_BASE"
          --docker-key-sha256 "$DOCKER_KEY_SHA256"
          --assets "$RUNNER_TEMP/ncp-reviewed-caddy"
          --output "$RUNNER_TEMP/ncp-fixture-evidence"
      - name: Upload measured evidence including blocked/failed status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, verified 2026-09-07
        with:
          name: ncp-empty-host-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ncp-fixture-evidence/
          if-no-files-found: warn
          retention-days: 14
