# =========================================================================
# map 전면 리버스 프록시 (nginx) — HTTPS 프론트(터널/CDN) ↔ user BFF 사이의 유일한 엣지.
#
# 아직 docker-compose 에 배선되어 있지 않다(엣지 도입 시 proxy 서비스를 추가하고
# 이 파일을 /etc/nginx/conf.d/default.conf 로 마운트한다). 배포처 중립 설정이다.
#
# 역할:
#   1) 경로 화이트리스트: /api/v1/* 와 /ws/chat 만 BFF(user:8080)로 전달, 그 외 404.
#   2) /actuator/* 차단 — 공개 노출 시 무인증 메트릭 유출 방지
#      (BFF SecurityConfig 가 /actuator 를 permitAll 하므로 엣지에서 막는다).
#   3) POST /api/v1/trip/generate 에 per-IP rate-limit(5 req/min, burst 3) —
#      AUTH_ENFORCED=false 라 무인증 공개이므로 Gemini 쿼터 남용을 엣지에서 방어.
#      BFF RateLimitFilter 는 /auth/* 만 커버하므로 이 라우트는 여기서만 제한됨.
#   4) /healthz — 업타임/헬스체크용 정적 200(백엔드 비의존).
#   5) 보안 헤더 부여.
#
# 이 파일은 /etc/nginx/conf.d/default.conf 로 마운트되어 stock nginx.conf 의
# http{} 안에 include 된다. 따라서 limit_req_zone(http 컨텍스트)이 여기서 유효하다.
#
# 클라이언트 실IP: 앞단 HTTPS 프론트(터널/CDN/리버스프록시)가 X-Forwarded-For 로
# 원 클라 IP 를 전달한다. realip 모듈로 remote_addr 를 원 클라 IP 로 치환하여
# rate-limit 키가 프론트 IP 로 뭉치지 않게 한다(로컬 테스트는 XFF 부재 →
# remote_addr 그대로 사용). set_real_ip_from 0.0.0.0/0 은 오직 신뢰 프론트만
# 이 프록시에 도달한다는 전제(노출 경로에 인증 프론트/네트워크 격리 병행)에서 안전.
# =========================================================================

# rate-limit 존: 원 클라 IP 당 분당 5회. 10MB ≈ 16만 IP 상태 추적.
limit_req_zone $binary_remote_addr zone=tripzone:10m rate=5r/m;

server {
    listen 80;
    server_name _;

    # 원 클라 IP 복원 (프론트 XFF). 로컬(XFF 없음)에서는 무영향.
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # 보안 헤더 (모든 응답).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # 업로드/생성 요청이 클 수 있어 여유. (기본 1m 로도 충분하나 명시.)
    client_max_body_size 2m;

    # (4) 헬스체크 — 백엔드 비의존 정적 200. /actuator 는 절대 노출 안 함.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # (2) actuator 전면 차단 (BFF permitAll 이지만 엣지에서 404).
    location /actuator {
        return 404;
    }

    # (3) trip/generate 전용 rate-limit. burst 3, nodelay(즉시 초과분 429).
    #     LLM 생성이 길어 read timeout 300s.
    location = /api/v1/trip/generate {
        limit_req zone=tripzone burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://user:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # (1) 그 외 /api/v1/* 화이트리스트 → BFF.
    location /api/v1/ {
        proxy_pass http://user:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # (1) chat WebSocket(B8, 현재 휴면). Upgrade 핸드셰이크 전달.
    #     (챗은 헤더 기반 인증; 일부 터널의 쿼리스트링 소실 이슈와 무관.)
    location /ws/chat {
        proxy_pass http://user:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # 기본 거부 — 화이트리스트 외 전부 404.
    location / {
        return 404;
    }
}
