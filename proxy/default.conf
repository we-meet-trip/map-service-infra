# =========================================================================
# map 전면 리버스 프록시 (nginx) — HTTPS 프론트(터널/CDN) ↔ 백엔드 사이의 유일한 엣지.
#
# docker-compose.yml 의 proxy 서비스가 이 파일을 /etc/nginx/conf.d/default.conf
# 로 마운트한다. 배포처 중립 설정이다.
#
# 역할:
#   1) 경로 화이트리스트: /api/v1/* 와 /ws/chat 은 BFF(user:8080), /ws/vision 은
#      카메라 인식 서비스(yolo:8000)로 전달하고, 그 외는 전부 404.
#   2) /actuator/* 차단 — 공개 노출 시 무인증 메트릭 유출 방지
#      (BFF SecurityConfig 가 /actuator 를 permitAll 하므로 엣지에서 막는다).
#   3) POST /api/v1/trip/generate 에 per-IP rate-limit(5 req/min, burst 3) —
#      AUTH_ENFORCED=false 라 무인증 공개이므로 Gemini 쿼터 남용을 엣지에서 방어.
#      BFF RateLimitFilter 는 /auth/* 만 커버하므로 이 라우트는 여기서만 제한됨.
#      /ws/vision 도 자체 인증이 없어 같은 취지의 상한을 건다.
#   4) /healthz — 업타임/헬스체크용 정적 200(백엔드 비의존).
#   5) 보안 헤더 부여.
#
# 이 파일은 /etc/nginx/conf.d/default.conf 로 마운트되어 stock nginx.conf 의
# http{} 안에 include 된다. 따라서 limit_req_zone(http 컨텍스트)이 여기서 유효하다.
#
# 클라이언트 실IP: 앞단 HTTPS 프론트(터널/CDN/리버스프록시)가 원 클라 IP 를
# 헤더로 전달한다. realip 모듈로 remote_addr 를 그 값으로 치환해 rate-limit 키가
# 프론트 IP 하나로 뭉치지 않게 한다(로컬은 헤더 부재 → remote_addr 그대로).
#
# 신뢰 대역과 헤더 선택이 이 파일 전체의 rate-limit 을 좌우한다.
#   - 신뢰 대역을 전체(0.0.0.0/0)로 두면 요청자가 보낸 헤더를 그대로 믿게 되어
#     remote_addr 를 요청자가 직접 지정할 수 있다. 그러면 아래 limit_req·limit_conn
#     의 키가 전부 요청자 통제 하에 들어가 값을 바꿔가며 무한히 우회된다.
#     그래서 이 프록시에 실제로 도달할 수 있는 사설/루프백 대역만 신뢰한다.
#   - 헤더도 X-Forwarded-For 대신 CF-Connecting-IP 를 쓴다. XFF 는 요청자가
#     여러 값을 이어 붙일 수 있어 어느 원소가 진짜인지 헤더만 봐서는 모른다.
#     터널 앞단은 CF-Connecting-IP 를 단일 값으로 덮어쓰므로 조작분이 남지 않는다.
#     헤더가 없으면 치환이 일어나지 않고 remote_addr 가 그대로 쓰인다(fail-safe).
#   - real_ip_recursive 는 off. 단일 값 헤더라 재귀 탐색이 필요 없고, 켜 두면
#     헤더가 여러 값일 때 다시 왼쪽 끝(요청자가 쓴 값)으로 밀려간다.
# 다른 프론트로 바꾸면 그 프론트가 덮어쓰는 헤더 이름으로 함께 고쳐야 한다.
# =========================================================================

# rate-limit 존: 원 클라 IP 당 분당 5회. 10MB ≈ 16만 IP 상태 추적.
limit_req_zone $binary_remote_addr zone=tripzone:10m rate=5r/m;

# vision WS 존: 접속 시도는 분당 10회까지, 한 IP 가 동시에 붙는 연결은 3개까지.
limit_req_zone  $binary_remote_addr zone=visionhs:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=visionconn:10m;

server {
    listen 80;
    server_name _;

    # 상류 주소는 전부 변수에 담아 넘긴다. 리터럴로 적으면 nginx 가 기동할 때
    # 딱 한 번 이름을 풀고 그 주소를 고정해 버린다. 컨테이너를 다시 만들면 주소가
    # 바뀌는데 관문은 옛 주소로 계속 보내서, 그 뒤로 모든 요청이 502 가 되고
    # 관문을 따로 재시작해야만 복구된다(BFF 를 새로 배포할 때마다 전 API 와 채팅이
    # 함께 끊긴다는 뜻이다). 변수로 두면 요청이 올 때 풀므로 그런 일이 없다.
    # 127.0.0.11 은 Docker 내장 DNS 다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $bff_upstream   http://user:8080;
    set $vision_upstream http://yolo:8000;

    # 원 클라 IP 복원. 이 프록시에 도달 가능한 대역만 신뢰한다(파일 상단 주석 참조).
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    # 보안 헤더 (모든 응답).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # 업로드/생성 요청이 클 수 있어 여유. (기본 1m 로도 충분하나 명시.)
    client_max_body_size 2m;

    # (4) 헬스체크 — 백엔드 비의존 정적 200. /actuator 는 절대 노출 안 함.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # (2) actuator 전면 차단 (BFF permitAll 이지만 엣지에서 404).
    location /actuator {
        return 404;
    }

    # (3) trip/generate 전용 rate-limit. burst 3, nodelay(즉시 초과분 429).
    #     LLM 생성이 길어 read timeout 300s.
    location = /api/v1/trip/generate {
        limit_req zone=tripzone burst=3 nodelay;
        limit_req_status 429;
        proxy_pass $bff_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # (1) 그 외 /api/v1/* 화이트리스트 → BFF.
    location /api/v1/ {
        proxy_pass $bff_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # (1) chat WebSocket(B8). Upgrade 핸드셰이크 전달.
    #     인증은 소켓이 열린 뒤 STOMP CONNECT 프레임의 헤더로 한다 — 핸드셰이크에
    #     헤더를 싣기 어려운 클라이언트가 있어서다. 쿼리스트링을 쓰지 않으므로
    #     쿼리를 흘리는 터널 뒤에서도 인증이 깨지지 않는다.
    location /ws/chat {
        proxy_pass $bff_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
    }

    # (1) vision WebSocket — 카메라 프레임 스트림을 yolo 로 넘긴다.
    #     yolo 는 vision 프로파일이라 떠 있지 않을 수 있다. 주소를 변수로 두어
    #     요청 시점에 이름을 풀므로, 없을 때도 이 경로만 502 이고 관문 자체는 뜬다.
    #     yolo 에는 자체 인증이 없어 접속 시도 횟수와 동시 연결 수를 여기서
    #     제한한다. 연결을 맺은 뒤의 메시지 남용까지는 막지 못한다.
    location /ws/vision {
        limit_req zone=visionhs burst=5 nodelay;
        limit_req_status 429;
        limit_conn visionconn 3;
        proxy_pass $vision_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
    }

    # 기본 거부 — 화이트리스트 외 전부 404.
    location / {
        return 404;
    }
}
