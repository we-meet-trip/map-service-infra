# 메모리 1GB 짜리 서버에 시험 스택을 얹기 위한 덧칠. 시험 오버레이 뒤에 붙인다.
#
#   docker compose --env-file ./.env.test \
#     -f docker-compose.yml -f docker-compose.test.yml -f docker-compose.micro.yml \
#     --profile full up -d
#
# 왜 따로 두는가. 시험 오버레이의 상한은 넉넉한 서버를 전제로 잡았고, 그 값의
# 합은 1GB 짜리 서버에 들어가지 않는다. 그렇다고 그 값을 내려 버리면 여유 있는
# 서버에서도 쓸데없이 좁아진다. 그래서 목표 서버가 작을 때만 덧칠한다.
#
# 여기서 깎는 것은 공짜가 아니다. 무엇을 대가로 치르는지 각 항목에 적었다.
# 부하를 걸어 재는 용도로는 쓸 수 없다 — 좁혀 둔 것이 병목으로 먼저 잡힌다.

services:
  postgres:
    # 기본 공유 버퍼가 128MB 라 상한을 이보다 낮게 잡으면 기동 중에 죽는다.
    # 버퍼를 함께 줄이고, 동시 연결도 낮춘다. 연결 하나마다 작업 메모리가
    # 따로 잡히므로 상한을 줄이면서 연결 수를 그대로 두면 질의가 몰릴 때
    # 터진다. 앱 세 개가 각자 묶음을 들고 있어 30 이면 충분하다.
    command:
      - postgres
      - -c
      - shared_buffers=48MB
      - -c
      - max_connections=30
      - -c
      - work_mem=2MB
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 224m

  redis:
    # 스스로 쓸 상한을 알려 준다. 알려 주지 않으면 컨테이너 상한에 부딪혀
    # 프로세스째 죽는데, 알려 주면 오래된 것부터 버리고 살아남는다.
    # 여기 담기는 것은 캐시와 카운터라 버려도 다시 만들어진다.
    # 기본 파일과 같은 셸 형태를 유지한다. 배열로 바꾸면 비밀번호를 붙이는
    # 조건부가 함께 사라지는데, 값이 비어 있는 환경에서는 그 사실이 드러나지
    # 않다가 값을 넣는 순간 인증 없이 뜬다.
    # 버리는 대상을 만료가 걸린 것으로 한정한다. 모든 키를 대상으로 두면
    # 아직 확인되지 않은 작업 메시지까지 버려질 수 있는데, 그 키에는 만료가
    # 없어 캐시와 구분되지 않는다. 그렇게 사라진 작업은 실패 통지도 없이
    # 사라져, 기다리던 쪽이 사유 없는 시간 초과만 받는다.
    command: ["sh", "-c", "redis-server --appendonly yes --maxmemory 32mb --maxmemory-policy volatile-lru $${REDIS_PASSWORD:+--requirepass $$REDIS_PASSWORD}"]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64m

  # 재 보니 이 상한에서 BFF 는 천장에 붙어 돈다 — 정점이 상한과 같고 상한에
  # 열세 번 닿았다. 죽지는 않았지만 여유가 없다는 뜻이고, 그 사실은 어느
  # 로그에도 남지 않고 상태 확인도 계속 정상이라고 답한다.
  #
  # 이 덧칠은 1GB 급 서버를 위한 것이다. 그보다 큰 서버에서는 얹지 마라 —
  # 얹으면 얻는 것 없이 이 위험만 생긴다.
  user:
    environment:
      # 상한이 작아질수록 힙 밖에서 쓰는 몫의 비중이 커진다. 비율만 낮추면
      # 그 몫은 그대로라 결국 상한에 닿으므로, 큰 항목마다 따로 못을 박는다.
      #   MaxMetaspaceSize  클래스 정보. 스프링은 시작할 때 많이 읽어 들이고
      #                     그 뒤로는 거의 늘지 않는다. 160m 아래로 내리면
      #                     기동 도중에 죽는데, 그때 컨테이너는 살아 있고
      #                     자원 한도에 걸린 표시도 남지 않아 밖에서는
      #                     정상으로 보인다. 요청을 보내야 비로소 드러난다.
      #   ReservedCodeCache 기계어로 번역해 둔 코드. 좁히면 자주 쓰는 곳만
      #                     번역된 채로 남아 최고 속도가 조금 떨어진다.
      #   MaxDirectMemory   힙 밖 버퍼. 네트워크 입출력이 여기를 쓴다.
      #   SerialGC          정리하는 일꾼을 하나로 둔다. 여러 일꾼은 각자
      #                     작업 공간을 잡는데 이 크기에서는 그 몫이 아깝다.
      # 대가는 응답 속도다. 부하를 재는 용도로 이 덧칠을 쓰면 안 된다.
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=55
        -XX:MaxMetaspaceSize=160m
        -XX:ReservedCodeCacheSize=48m
        -XX:MaxDirectMemorySize=32m
        -XX:+UseSerialGC
        -Xss512k
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 448m

  agent:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 192m

  hub:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 192m

  proxy:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 32m
